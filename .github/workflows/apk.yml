name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: node --test tests/*.test.mjs
      - name: Probar los alias de iconos de temporada
        run: python3 tests/manifiesto_iconos.test.py
      - name: Probar el ecualizador (Java)
        run: |
          mkdir -p /tmp/jc
          javac -d /tmp/jc native/java/Reverb.java native/java/NucleoEq.java tests/java/PruebaEq.java
          java -cp /tmp/jc PruebaEq
      - run: npm install
      - run: npx cap add android
      - name: Instalar el plugin nativo de carpetas
        run: |
          cp native/java/*.java android/app/src/main/java/com/camo/onda/
          python3 native/parchear.py
      - run: npx cap sync android
      - name: Compilar APK de prueba
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log || {
            grep -E "error:|AAPT|What went wrong|Execution failed|symbol:|location:|\.java:[0-9]+" ../gradle.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          }
      - name: Firmar el APK con la clave fija
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            [ -n "${!v}" ] || { echo "::error::Falta el secreto de GitHub para $v (ver el README, sección «Firma del APK»)"; exit 1; }
          done
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          KS="$RUNNER_TEMP/onda.keystore"
          echo "$KS_B64" | base64 -d > "$KS"
          cp android/app/build/outputs/apk/debug/app-debug.apk Onda.apk
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS Onda.apk
          "$APKSIGNER" verify --print-certs Onda.apk | grep -E "SHA-256"
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-apk
          path: Onda.apk
