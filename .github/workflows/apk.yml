name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: node --test tests/*.test.mjs
      - name: Probar el ecualizador (Java)
        run: |
          mkdir -p /tmp/jc
          javac -d /tmp/jc native/java/NucleoEq.java tests/java/PruebaEq.java
          java -cp /tmp/jc PruebaEq
      - run: npm install
      - run: npx cap add android
      - name: Instalar el plugin nativo de carpetas
        run: |
          cp native/java/*.java android/app/src/main/java/com/camo/onda/
          python3 native/parchear.py
      - run: npx cap sync android
      - name: Compilar APK de prueba
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log || {
            grep -E "error:|AAPT|What went wrong|Execution failed|symbol:|location:|\.java:[0-9]+" ../gradle.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
